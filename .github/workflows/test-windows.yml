name: Test Windows installer

on:
  push:
    branches:
      - codex/test-retention-build-20261028
      - codex/performance-dashboard

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install dependencies
        run: npm ci
      - name: Check note save queue
        run: npm run test:save-queue
      - name: Build installer
        run: npm run tauri build
      - name: Run Rust tests
        run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - name: Upload test installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TimePast-performance-test-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
